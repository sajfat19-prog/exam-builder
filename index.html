<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0875a8"><meta name="description" content="منشئ أوراق الامتحانات العربية والإنجليزية"><link rel="manifest" href="manifest.json"><title>منشئ أوراق الامتحانات</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="toolbar"><button id="undo" title="تراجع">↶</button><button id="fontToggle" title="إعدادات الخط">Aa</button><button id="themeToggle" title="الثيم والألوان">◉</button><button id="darkToggle" title="الوضع الليلي">☾</button><button id="helpToggle" title="مساعدة">؟</button></div>
<div id="themePanel" class="top-panel" hidden><strong>اختيار الثيم</strong><div class="swatches"><button data-theme="blue" style="--swatch:#0875a8" aria-label="أزرق"></button><button data-theme="purple" style="--swatch:#7954b8" aria-label="بنفسجي"></button><button data-theme="teal" style="--swatch:#159d9a" aria-label="تركوازي"></button><button data-theme="green" style="--swatch:#268653" aria-label="أخضر"></button><button data-theme="burgundy" style="--swatch:#9d405a" aria-label="عنابي"></button><button data-theme="gold" style="--swatch:#b58a32" aria-label="ذهبي"></button></div><label class="dark-switch"><input id="darkMode" type="checkbox"> الوضع الليلي Dark</label></div>
<div id="fontPanel" class="top-panel" hidden><strong>إعدادات الخط</strong><label>نوع الخط<select id="uiFont"><option value="Cairo">Cairo</option><option value="Tajawal">Tajawal</option><option value="Amiri">Amiri</option><option value="Noto Naskh Arabic">Noto Naskh Arabic</option><option value="Arial">Arial</option><option value="Roboto">Roboto</option><option value="Georgia">Georgia</option></select></label><label>حجم الخط <input id="uiFontSize" type="range" min="12" max="22" value="16"><output id="uiFontSizeValue">16</output>px</label></div></header>
<main class="wrap">
<section id="language" class="panel language"><h2>ابدأ امتحاناً جديداً</h2><p>اختر لغة ورقة الأسئلة</p><div class="langgrid"><button class="lang active" data-lang="ar">العربية <span>من اليمين ←</span></button><button class="lang" data-lang="en">English <span>→ From left</span></button></div><button id="start" class="primary wide">إنشاء امتحان جديد</button></section>
<section id="editor" hidden>
<div class="panel settings"><h3>⚙ إعدادات الشكل والطباعة</h3><div class="tabs"><button class="selected">▤ الورقة</button><button> T النص والدرجات</button><button>▣ أعلى وأسفل</button></div>
<div class="setting"><label>الفاصل</label><select><option>خط متصل</option><option>خط متقطع</option><option>بدون</option></select></div>
<div class="setting"><label>الفرع الأول في سطر السؤال</label><input type="checkbox"></div>
<div class="setting"><label>حجم الطباعة</label><select><option>صفحات متعددة</option><option>صفحة واحدة</option></select></div>
<div class="setting"><label>الهوامش</label><select><option>عادي</option><option>ضيّق</option><option>واسع</option></select></div>
<div class="setting"><label>اتجاه الورقة</label><select><option>عمودي</option><option>أفقي</option></select></div>
<div class="setting"><label>الأرقام</label><div class="pills"><button class="chosen">إنكليزية 123</button><button>عربية ١٢٣</button></div></div>
<div class="setting"><label>إطار الورقة</label><div class="pills"><button class="chosen">مزدوج</button><button>مفرد</button><button>بلا إطار</button></div></div></div>
<details class="panel" open><summary>▣ معلومات الامتحان <small>2026 - 2027</small></summary><div class="fields">
<label>اسم المؤسسة<textarea rows="2" placeholder="جمهورية العراق&#10;وزارة التربية&#10;مديرية التربية"></textarea></label>
<label>عنوان الامتحان<input value="أسئلة الامتحان"></label>
<div class="two"><label>الصف / المرحلة<input placeholder="الثالث متوسط"></label><label>المادة<input placeholder="اللغة الإنكليزية"></label></div>
<div class="two"><label>العام الدراسي<input value="2026 - 2027"></label><label>التاريخ<input type="date" value="2026-11-19"></label></div>
<div class="two"><label>الزمن<input placeholder="ساعة"></label><label>الدور (اختياري)<input placeholder="الأول"></label></div>
<label>مدرس أو معلم المادة<input placeholder="مثال: مدرس المادة: أ. علي حسن"></label>
<label>عضو اللجنة (اختياري)<input placeholder="مثال: عضو اللجنة: أ. حسن كاظم"></label>
<label>التهنئة<input placeholder="مع تمنياتنا لكم بالنجاح والتوفيق"></label>
<label>ترقيم الصفحات<input placeholder="مثال: صفحة 1 من 2 - اقلب الورقة"></label>
<label>تحملة السؤال<input placeholder="تكملة السؤال"></label><label>تحملة الفرع<input placeholder="تكملة الفرع"></label>
<label>ملاحظة (اختيارية)<input placeholder="ملاحظات خاصة بالامتحان"></label>
</div></details>
<div class="summary">سؤال واحد · <b id="total">0</b> درجة</div>
<div id="questions"></div>
<div class="actions"><button id="addQuestion" class="primary">＋ سؤال</button><button id="preview" class="secondary">معاينة الورقة</button></div>
</section>
<section id="previewPane" class="panel" hidden><div class="previewbar"><button id="backEdit">عودة للتحرير</button><button id="print">طباعة / PDF</button></div><article id="paper" class="paper"></article></section>
<section id="library" class="panel"><h3>ملف</h3><div class="file-actions"><button id="save">حفظ باسم</button><button id="open">فتح امتحان محفوظ</button><button id="new">امتحان جديد</button></div><div id="savedList"></div></section>
</main>
<nav class="bottom"><button>◉<span>الدعم والشروحات</span></button><button id="fileTab">▱<span>ملف</span></button><button id="paperTab">▤<span>الورقة</span></button></nav>
<dialog id="saveDialog"><form method="dialog"><h3>حفظ الامتحان</h3><input id="saveName" placeholder="اسم الامتحان"><div class="dialog-actions"><button value="cancel">إلغاء</button><button id="confirmSave" value="ok" class="primary">حفظ</button></div></form></dialog>
<script src="app.js"></script>
</body></html>
