<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0875a8"><meta name="description" content="منشئ أوراق الامتحانات العربية والإنجليزية">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<title>منشئ أوراق الامتحانات</title>
</head>
<body>
<header class="top"><div class="toolbar">
<button id="undo" title="تراجع" aria-label="تراجع">↶</button><button id="fontToggle" title="إعدادات الخط">Aa</button><button id="themeToggle" title="الثيم والألوان">◉</button><button id="darkToggle" title="الوضع الليلي">☾</button><button id="helpToggle" title="مساعدة">؟</button>
</div>
<div id="themePanel" class="top-panel" hidden><strong>اختيار الثيم</strong><div class="swatches"><button data-theme="blue" style="--swatch:#0875a8" aria-label="أزرق"></button><button data-theme="purple" style="--swatch:#7954b8" aria-label="بنفسجي"></button><button data-theme="teal" style="--swatch:#159d9a" aria-label="تركوازي"></button><button data-theme="green" style="--swatch:#268653" aria-label="أخضر"></button><button data-theme="burgundy" style="--swatch:#9d405a" aria-label="عنابي"></button><button data-theme="gold" style="--swatch:#b58a32" aria-label="ذهبي"></button></div><label class="dark-switch"><input id="darkMode" type="checkbox"> الوضع الليلي Dark</label></div>
<div id="fontPanel" class="top-panel" hidden><strong>إعدادات الخط</strong><label>نوع الخط<select id="uiFont"><option>Cairo</option><option>Tajawal</option><option>Amiri</option><option>Noto Naskh Arabic</option><option>Noto Sans Arabic</option><option>IBM Plex Sans Arabic</option><option>Arial</option><option>Roboto</option><option>Lato</option><option>Georgia</option><option>Times New Roman</option></select></label><label>حجم الخط <input id="uiFontSize" type="range" min="12" max="22" value="16"><output id="uiFontSizeValue">16</output>px</label></div>
</header>
<main class="wrap">
<section id="language" class="panel language"><h2>ابدأ امتحاناً جديداً</h2><p>اختر لغة ورقة الأسئلة</p><div class="langgrid"><button class="lang active" data-lang="ar">العربية <span>من اليمين ←</span></button><button class="lang" data-lang="en">English <span>→ From left</span></button></div><button id="start" class="primary wide">إنشاء امتحان جديد</button></section>
<section id="editor" hidden>
<div class="panel settings"><h3>⚙ إعدادات الشكل والطباعة</h3><div class="tabs"><button class="selected" data-tab="paper">▤ الورقة</button><button data-tab="text">T النص والدرجات</button><button data-tab="header">▣ أعلى وأسفل</button></div>
<div class="tab-content" data-content="paper">
<div class="setting"><label>الفاصل بين الأسئلة</label><select id="separator"><option value="solid">خط متصل</option><option value="dashed">خط متقطع</option><option value="none">بدون</option></select></div>
<div class="setting"><label>الفرع الأول في سطر السؤال</label><input id="inlineFirst" type="checkbox"></div>
<div class="setting"><label>حجم الطباعة</label><select id="pageFit"><option value="multi">صفحات متعددة</option><option value="single">صفحة واحدة (ملاءمة)</option></select></div>
<div class="setting"><label>الهوامش</label><select id="margins"><option value="normal">عادي</option><option value="narrow">ضيّق</option><option value="wide">واسع</option></select></div>
<div class="setting"><label>اتجاه الورقة</label><select id="orientation"><option value="portrait">عمودي</option><option value="landscape">أفقي</option></select></div>
<div class="setting"><label>الأرقام</label><div class="pills"><button type="button" class="chosen" data-numbers="en">إنكليزية 123</button><button type="button" data-numbers="ar">عربية ١٢٣</button></div></div>
<div class="setting"><label>إطار الورقة</label><div class="pills"><button type="button" class="chosen" data-border="double">مزدوج</button><button type="button" data-border="single">مفرد</button><button type="button" data-border="none">بلا إطار</button></div></div>
</div>
<div class="tab-content" data-content="text" hidden>
<div class="setting"><label>خط ورقة الامتحان</label><select id="paperFont"><option value="Cairo">Cairo</option><option value="Tajawal">Tajawal</option><option value="Amiri">Amiri</option><option value="Noto Naskh Arabic">Noto Naskh Arabic</option><option value="Noto Sans Arabic">Noto Sans Arabic</option><option value="Arial">Arial</option><option value="Roboto">Roboto</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option></select></div>
<div class="setting"><label>حجم نص الأسئلة</label><input id="paperFontSize" type="range" min="10" max="24" value="14"><output id="paperFontSizeValue">14</output>px</div>
<div class="setting"><label>حجم العنوان</label><input id="titleFontSize" type="range" min="14" max="32" value="20"><output id="titleFontSizeValue">20</output>px</div>
<div class="setting"><label>إظهار درجات الأسئلة</label><input id="showMarks" type="checkbox" checked></div>
<div class="setting"><label>إظهار المجموع الكلي</label><input id="showTotal" type="checkbox" checked></div>
</div>
<div class="tab-content" data-content="header" hidden>
<div class="setting"><label>إظهار إطار الورقة</label><input id="showBorder" type="checkbox" checked></div>
<div class="setting"><label>إظهار رقم الصفحة</label><input id="showPageNumber" type="checkbox" checked></div>
<div class="setting"><label>تذييل الورقة</label><input id="footerText" placeholder="مع تمنياتنا لكم بالنجاح والتوفيق"></div>
</div>
</div>
<details class="panel" open><summary>▣ معلومات الامتحان <small>2026 - 2027</small></summary><div class="fields">
<label>اسم المؤسسة<textarea id="institution" rows="2" placeholder="جمهورية العراق&#10;وزارة التربية&#10;مديرية التربية"></textarea></label>
<label>عنوان الامتحان<input id="examTitle" value="أسئلة الامتحان"></label>
<div class="two"><label>الصف / المرحلة<input id="grade" placeholder="الثالث متوسط"></label><label>المادة<input id="subject" placeholder="اللغة الإنكليزية"></label></div>
<div class="two"><label>العام الدراسي<input id="schoolYear" value="2026 - 2027"></label><label>التاريخ<input id="examDate" type="date"></label></div>
<div class="two"><label>الزمن<input id="duration" placeholder="ساعة"></label><label>الدور (اختياري)<input id="round" placeholder="الأول"></label></div>
<label>مدرس أو معلم المادة<input id="teacher" placeholder="مثال: مدرس المادة: أ. علي حسن"></label>
<label>عضو اللجنة (اختياري)<input id="committee" placeholder="مثال: عضو اللجنة: أ. حسن كاظم"></label>
<label>عبارة أعلى الورقة<input id="topNote" placeholder="بسم الله الرحمن الرحيم"></label>
<label>عبارة أسفل الورقة<input id="bottomNote" placeholder="مع تمنياتنا لكم بالنجاح والتوفيق"></label>
</div></details>
<div class="summary"><span id="questionCount">0 سؤال</span> · <b id="total">0</b> <span id="markLabel">درجة</span></div>
<div id="questions"></div>
<div class="actions"><button id="addQuestion" class="primary">＋ سؤال</button><button id="preview" class="secondary">معاينة الورقة</button></div>
</section>
<section id="previewPane" class="panel" hidden><div class="previewbar"><button id="backEdit" class="secondary">عودة للتحرير</button><div><button id="downloadPdf" class="secondary">حفظ PDF</button> <button id="print" class="primary">طباعة الورقة</button></div></div><div id="paper" class="paper"></div></section>
<section id="library" class="panel"><h3>ملف الامتحانات</h3><div class="file-actions"><button id="save" class="primary">حفظ باسم</button><button id="exportData">تصدير نسخة احتياطية</button><label class="import-label">استيراد نسخة احتياطية<input id="importData" type="file" accept="application/json"></label><button id="open">عرض الامتحانات المحفوظة</button><button id="new">امتحان جديد</button></div><div id="savedList"></div></section>
</main>
<nav class="bottom"><button id="helpBottom">◉<span>الدعم والشروحات</span></button><button id="fileTab">▱<span>ملف</span></button><button id="paperTab">▤<span>الورقة</span></button></nav>
<dialog id="saveDialog"><form method="dialog"><h3>حفظ الامتحان</h3><input id="saveName" placeholder="اسم الامتحان" required><div class="dialog-actions"><button value="cancel" class="secondary">إلغاء</button><button id="confirmSave" value="ok" class="primary">حفظ</button></div></form></dialog>
<script src="app.js"></script>
</body></html>
